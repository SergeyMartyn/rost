<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2500" viewBox="0 0 1440 2500"><title>TI-games-host-landing-desktop.svg</title><rect x="0" y="0" width="1440" height="700" rx="0" fill="#f5f7f0" opacity="1"/><rect x="120" y="14" width="1200" height="64" rx="24" fill="#214c3f" opacity="1"/><circle cx="152" cy="46" r="22" fill="#FFFFFF"/><image x="130" y="24" width="44" height="44" href="https://rost.community/brand-tree-96.png"/><text x="186" y="51" fill="#FFFFFF" font-family="Onest, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="186" dy="0">R.O.S.T.</tspan></text><text x="665.0" y="51" fill="#FFFFFF" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="665.0" dy="0">Мероприятия     О нас     Контакты</tspan></text><rect x="1124" y="22" width="178" height="48" rx="24" fill="#FFFFFF" opacity="1"/><text x="1213.0" y="50.9" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5"><tspan x="1213.0" dy="0">Принять участие</tspan></text><text x="120" y="142" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5"><tspan x="120" dy="0">МЕРОПРИЯТИЯ / ДЛЯ ВЕДУЩИХ</tspan></text><rect x="120" y="174" width="206" height="34" rx="17" fill="#f0cf63" opacity="1"/><text x="223.0" y="195.2" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5"><tspan x="223.0" dy="0">7 НОЯБРЯ · МЮНХЕН</tspan></text><text x="120" y="282" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="58" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">Проведите свою игру</tspan><tspan x="120" dy="62.6">на встрече R.O.S.T.</tspan></text><text x="120" y="442" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">Две игровые линейки, знакомство с участниками</tspan><tspan x="120" dy="30.0">и поддержка команды на каждом этапе.</tspan></text><rect x="120" y="552" width="370" height="60" rx="16" fill="#214c3f" opacity="1"/><text x="305.0" y="587.6" fill="#FFFFFF" font-family="Onest, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0"><tspan x="305.0" dy="0">Зарегистрироваться и занять стол</tspan></text><text x="120" y="646" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">7 столов для ведущих · бронирование на 30 минут</tspan></text><rect x="914" y="146" width="406" height="438" rx="30" fill="#c8d9bf" opacity="1"/><defs><clipPath id="avatar-17"><circle cx="1117" cy="350" r="173"/></clipPath></defs><image x="944" y="177" width="346" height="346" href="https://rost.network/assets/img/Speaker5.png" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-17)"/><rect x="0" y="700" width="1440" height="525" rx="0" fill="#FFFFFF" opacity="1"/><text x="120" y="795" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5"><tspan x="120" dy="0">ФОРМАТ</tspan></text><text x="120" y="856" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="44" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">Ваша игра — в центре дня</tspan></text><rect x="120" y="920" width="580" height="106" rx="20" fill="#f5f7f0" opacity="1"/><text x="144" y="962" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="144" dy="0">Две игровые линейки</tspan></text><text x="144" y="995" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="144" dy="0">Проведите две сессии по два часа.</tspan></text><rect x="730" y="920" width="580" height="106" rx="20" fill="#f5f7f0" opacity="1"/><text x="754" y="962" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="754" dy="0">Знакомство со всеми</tspan></text><text x="754" y="995" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="754" dy="0">Коротко представьте себя и свою игру.</tspan></text><rect x="120" y="1046" width="580" height="106" rx="20" fill="#f5f7f0" opacity="1"/><text x="144" y="1088" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="144" dy="0">Поддержка команды</tspan></text><text x="144" y="1121" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="144" dy="0">Пространство, координация и продвижение.</tspan></text><rect x="730" y="1046" width="580" height="106" rx="20" fill="#f5f7f0" opacity="1"/><text x="754" y="1088" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="754" dy="0">Профиль на сайте</tspan></text><text x="754" y="1121" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="754" dy="0">Участники смогут узнать о вас заранее.</tspan></text><rect x="0" y="1225" width="1440" height="785" rx="0" fill="#f5f7f0" opacity="1"/><text x="120" y="1320" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5"><tspan x="120" dy="0">УСЛОВИЯ</tspan></text><text x="120" y="1387" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="44" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">Выберите формат участия</tspan></text><rect x="120" y="1440" width="590" height="264" rx="24" fill="#f5f7f0" opacity="1" stroke="#214c3f" stroke-width="2"/><circle cx="156" cy="1483" r="10" fill="#FFFFFF" stroke="#214c3f" stroke-width="2"/><circle cx="156" cy="1483" r="5" fill="#214c3f"/><text x="178" y="1491" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="178" dy="0">Стандартное участие</tspan></text><text x="675" y="1491" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="29" font-weight="400" text-anchor="end" letter-spacing="0"><tspan x="675" dy="0">249 €</tspan></text><text x="178" y="1543" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="178" dy="0">Две игры, профиль, самопрезентация, продвижение и сертификат.</tspan></text><line x1="148" y1="1582" x2="675" y2="1582" stroke="#c5ceca" stroke-width="1"/><text x="148" y="1631" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="148" dy="0">Приглашение в ваших соцсетях раз в неделю.</tspan></text><rect x="730" y="1440" width="590" height="264" rx="24" fill="#FFFFFF" opacity="1" stroke="#c5ceca" stroke-width="1"/><circle cx="766" cy="1483" r="10" fill="#FFFFFF" stroke="#c5ceca" stroke-width="2"/><text x="788" y="1491" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="788" dy="0">Расширенное участие</tspan></text><text x="1285" y="1491" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="29" font-weight="400" text-anchor="end" letter-spacing="0"><tspan x="1285" dy="0">349 €</tspan></text><text x="788" y="1543" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="788" dy="0">Всё из стандартного формата и дополнительное продвижение R.O.S.T.</tspan></text><line x1="758" y1="1582" x2="1285" y2="1582" stroke="#c5ceca" stroke-width="1"/><text x="758" y="1631" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="758" dy="0">Можно сосредоточиться на подготовке игры.</tspan></text><rect x="120" y="1732" width="1200" height="90" rx="18" fill="#FFFFFF" opacity="1" stroke="#c5ceca" stroke-width="1"/><rect x="145" y="1763" width="22" height="22" rx="5" fill="#FFFFFF" opacity="1" stroke="#214c3f" stroke-width="2"/><text x="184" y="1769" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="184" dy="0">Добавить фото и видео</tspan></text><text x="1290" y="1769" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="22" font-weight="400" text-anchor="end" letter-spacing="0"><tspan x="1290" dy="0">+79 €</tspan></text><text x="184" y="1800" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="184" dy="0">10 профессиональных фотографий и один рилс</tspan></text><rect x="120" y="1840" width="1200" height="80" rx="18" fill="#FFFFFF" opacity="1" stroke="#c5ceca" stroke-width="1"/><rect x="145" y="1868" width="22" height="22" rx="5" fill="#FFFFFF" opacity="1" stroke="#214c3f" stroke-width="2"/><text x="184" y="1875" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="184" dy="0">Внести предоплату 50 €</tspan></text><text x="184" y="1902" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="184" dy="0">Отметьте, чтобы сейчас оплатить 50 € вместо полной стоимости.</tspan></text><text x="120" y="1964" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">Стоимость участия: 249 €</tspan></text><text x="1320" y="1964" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="end" letter-spacing="0"><tspan x="1320" dy="0">К оплате сейчас: 249 €</tspan></text><rect x="0" y="2010" width="1440" height="490" rx="0" fill="#FFFFFF" opacity="1"/><text x="120" y="2100" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5"><tspan x="120" dy="0">КАК ПРИСОЕДИНИТЬСЯ</tspan></text><text x="120" y="2159" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="38" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">Регистрация → оплата → ваш стол</tspan></text><text x="120" y="2220" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">Заполните данные и выберите способ оплаты. Стол резервируется на 30 минут.</tspan><tspan x="120" dy="28.9">После оплаты участие подтверждается. При предоплате остаток — по отдельной ссылке.</tspan></text><rect x="120" y="2350" width="370" height="58" rx="16" fill="#214c3f" opacity="1"/><text x="305.0" y="2384.6" fill="#FFFFFF" font-family="Onest, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0"><tspan x="305.0" dy="0">Зарегистрироваться и занять стол</tspan></text><text x="120" y="2432" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="120" dy="0">К оплате сейчас — 249 € · предоплата 50 € доступна по галочке выше</tspan></text><text x="520" y="2385" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="520" dy="0">Вопросы? Напишите Кристине в Telegram ↗</tspan></text></svg>