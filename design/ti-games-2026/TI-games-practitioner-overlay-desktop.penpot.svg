-spacing="0"><tspan x="1185" dy="0">Алла Афанасенко</tspan></text><rect x="0" y="0" width="1440" height="900" rx="0" fill="#214c3f" opacity="0.55"/><rect x="200" y="86" width="1040" height="728" rx="30" fill="#FFFFFF" opacity="1"/><text x="245" y="137" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.6"><tspan x="245" dy="0">ИГРОПРАКТИК · 1 ИЗ 5</tspan></text><circle cx="1187" cy="125" r="22" fill="#FFFFFF" stroke="#214c3f" stroke-width="1"/><text x="1187" y="132" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="1187" dy="0">×</tspan></text><circle cx="399" cy="324" r="151" fill="#f5f7f0"/><defs><clipPath id="avatar-36"><circle cx="399" cy="324" r="145"/></clipPath></defs><image x="254" y="179" width="290" height="290" href="https://rost.network/assets/img/Speaker5.png" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-36)"/><text x="245" y="568" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="245" dy="0">Другие ведущие</tspan></text><text x="245" y="612" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="245" dy="0">←    Катарина   ·   Елена   ·   Зинаида   ·   Алла</tspan></text><text x="614" y="211" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="40" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="614" dy="0">Кристина Бауэр</tspan></text><text x="614" y="248" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="614" dy="0">Неопсихолог, коуч и тренер эмоциональных состояний</tspan></text><line x1="614" y1="277" x2="1166" y2="277" stroke="#f0cf63" stroke-width="3"/><text x="614" y="315" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3"><tspan x="614" dy="0">ИГРА · AINSOF</tspan></text><text x="614" y="359" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="614" dy="0">Для тех, кто хочет увидеть новые</tspan><tspan x="614" dy="27.0">возможности и двигаться к цели.</tspan></text><text x="614" y="448" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="614" dy="0">На встрече можно исследовать свой запрос,</tspan><tspan x="614" dy="26.4">заметить ограничения и найти ресурсы</tspan><tspan x="614" dy="26.4">для следующего шага.</tspan></text><rect x="614" y="569" width="550" height="90" rx="18" fill="#f5f7f0" opacity="1"/><text x="638" y="604" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="638" dy="0">Подойдёт, если вы ищете ясность и мотивацию</tspan></text><text x="638" y="632" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="638" dy="0">Опыт игры не требуется</tspan></text><text x="614" y="738" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="614" dy="0">←  Все игропрактики</tspan></text></svg>