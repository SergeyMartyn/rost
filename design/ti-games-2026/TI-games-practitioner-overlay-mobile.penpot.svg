<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>TI-games-practitioner-overlay-mobile.svg</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" opacity="1"/><text x="20" y="45" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.3"><tspan x="20" dy="0">ИГРОПРАКТИК · 1 ИЗ 5</tspan></text><circle cx="353" cy="36" r="20" fill="#FFFFFF" stroke="#214c3f" stroke-width="1"/><text x="353" y="43" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="353" dy="0">×</tspan></text><circle cx="195" cy="187" r="111" fill="#f5f7f0"/><defs><clipPath id="avatar-5"><circle cx="195" cy="187" r="106"/></clipPath></defs><image x="89" y="81" width="212" height="212" href="https://rost.network/assets/img/Speaker5.png" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-5)"/><text x="20" y="354" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="34" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Кристина Бауэр</tspan></text><text x="20" y="390" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Неопсихолог, коуч и тренер</tspan><tspan x="20" dy="21.0">эмоциональных состояний</tspan></text><line x1="20" y1="445" x2="370" y2="445" stroke="#f0cf63" stroke-width="3"/><text x="20" y="483" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.3"><tspan x="20" dy="0">ИГРА · AINSOF</tspan></text><text x="20" y="526" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Увидеть возможности</tspan><tspan x="20" dy="27.6">и найти следующий шаг</tspan></text><text x="20" y="613" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Игра поможет исследовать свой запрос,</tspan><tspan x="20" dy="21.7">заметить ограничения и найти ресурсы</tspan><tspan x="20" dy="21.7">для движения к цели.</tspan></text><rect x="20" y="707" width="350" height="64" rx="16" fill="#f5f7f0" opacity="1"/><text x="36" y="734" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="36" dy="0">Подойдёт, если вам нужна ясность</tspan></text><text x="36" y="754" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="36" dy="0">Опыт игры не требуется</tspan></text><text x="195" y="818" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0"><tspan x="195" dy="0">←   Все ведущие   →</tspan></text></svg>