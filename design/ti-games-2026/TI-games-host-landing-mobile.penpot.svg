жка команды</tspan></text><text x="20" y="975" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Пространство и продвижение</tspan></text><rect x="0" y="1025" width="390" height="855" rx="0" fill="#f5f7f0" opacity="1"/><text x="20" y="1084" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.3"><tspan x="20" dy="0">УСЛОВИЯ</tspan></text><text x="20" y="1138" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="32" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Форматы участия</tspan></text><rect x="20" y="1180" width="350" height="166" rx="18" fill="#f5f7f0" opacity="1" stroke="#214c3f" stroke-width="2"/><circle cx="50" cy="1210" r="8" fill="#FFFFFF" stroke="#214c3f" stroke-width="2"/><circle cx="50" cy="1210" r="4" fill="#214c3f"/><text x="69" y="1218" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="69" dy="0">Стандартное</tspan></text><text x="352" y="1218" fill="#214c3f" font-family="Marmelad, Georgia, serif" font-size="23" font-weight="400" text-anchor="end" letter-spacing="0"><tspan x="352" dy="0">249 €</tspan></text><text x="69" y="1257" fill="#5b6c6b" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="69" dy="0">Проведение, профиль, анонсы, сертификат</tspan></text><line x1="38" y1="1278" x2="352" y2="1278" stroke="#c5ceca" stroke-width="1"/><text x="38" y="1307" fill="#214c3f" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="38" dy="0">Ваш анонс в соцсетях раз в неделю</tspan></text><rect x="20" y="1366" width="350" height="166" rx="18" fill="#FFFFFF" opacity="1" stroke="#c5ceca" stroke-width="1"/><circle cx="50" cy="1396" 